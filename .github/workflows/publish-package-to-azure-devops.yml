name: Reusable Release Workflow To Upload Packages To Azure DevOps

on: 
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Fetch all branches
        run: |
          git fetch --all  # Fetches the latest changes for all remote branches

      - name: Update local master
        run: |
          git checkout master
          git pull origin master  # Ensure we have the latest master branch
        
      - name: Tag release for package
        id: tag_release_for_package
        uses: K-Phoen/semver-release-action@v1.3.2
        with:
          release_branch: master
          release_strategy: tag
          tag_format: "%major%.%minor%.%patch%"

      - name: Update version in pyproject.toml
        run: |
          NEW_VERSION="${{ steps.tag_release_for_package.outputs.tag }}"
          echo "Updating pyproject.toml to version $NEW_VERSION"
          sed -i "s/version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          git add pyproject.toml
          git commit -m "Update version to $NEW_VERSION"
          git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build twine keyring artifacts-keyring
          
      - name: Build package
        run: python -m build
        
      - name: Upload package to Azure DevOps package feed

        run: |
          echo "REPOSITORY_URL is set to: ${{ vars.AZURE_DEVOPS_REPOSITORY_URL }}"
          echo "AZURE_DEVOPS_PAT is set: ${{ secrets.AZURE_DEVOPS_READ_WRITE_PAT != '' }}"
          echo "If false then either need to inherit secret in parent workflow from its repository or set as an organisation secret in this repository"
          
          python -m twine upload \
            --repository-url "${{ vars.AZURE_DEVOPS_REPOSITORY_URL }}" \
            --username "AzureDevOps" \
            --password "${{ secrets.AZURE_DEVOPS_READ_WRITE_PAT }}" \
            dist/* --verbose
